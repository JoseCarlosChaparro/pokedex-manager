# Production (Dokploy): one domain serves the web app; nginx proxies /api and /auth to the API.
# Required environment variables: JWT_SECRET_KEY, MONGO_USER, MONGO_PASSWORD (alphanumeric).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set}
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    depends_on:
      - mongo

  web:
    build:
      context: ./frontend
      args:
        # Empty: the frontend calls the API on its own origin (no CORS needed)
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

volumes:
  mongo-data:
