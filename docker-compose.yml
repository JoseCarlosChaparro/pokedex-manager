services:
  mongo:
    image: mongo:7
    # WiredTiger keeps a file per collection and index; the default limit is too low for test runs
    ulimits:
      nofile: { soft: 64000, hard: 64000 }
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    environment:
      MONGO_URL: mongodb://mongo:27017
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
