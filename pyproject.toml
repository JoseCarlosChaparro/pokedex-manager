[project]
name = "pokedex-manager"
version = "0.1.0"
description = "PokéDex Manager: FastAPI + MongoDB backend proxying PokéAPI, with JWT auth"
readme = "README.md"
authors = [
    { name = "JoseCarlosChaparro", email = "jc_chaparro@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
]

pokedex-manager = "pokedex_manager:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
