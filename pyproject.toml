[project]
name = "pokedex-manager"
version = "0.1.0"
description = "PokéDex Manager: FastAPI + MongoDB backend proxying PokéAPI, with JWT auth"
readme = "README.md"
authors = [
    { name = "JoseCarlosChaparro", email = "jc_chaparro@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
