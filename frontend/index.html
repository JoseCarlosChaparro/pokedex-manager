<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéDex Manager</title>
      <script>
      // Apply the saved theme before the first paint (no light flash in dark mode)
      try {
        const theme = localStorage.getItem('pokedex_theme') || 'system'
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (theme === 'dark' || (theme === 'system' && prefersDark)) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <script>
      // Set <html lang> from the saved language before the first paint (es by default)
      try {
        document.documentElement.lang = localStorage.getItem('pokedex_lang') === 'en' ? 'en' : 'es'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
