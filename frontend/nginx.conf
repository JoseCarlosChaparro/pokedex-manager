server {
    listen 80;
    root /usr/share/nginx/html;

    # Real client IP: skip trusted proxies (Traefik, cloudflared) on private networks and take the
    # last address they forwarded; a client-supplied X-Forwarded-For can't spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    index index.html;

    # Same-origin API: the browser calls /api and /auth on this domain and nginx forwards them to the backend
    location ~ ^/(api|auth)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
