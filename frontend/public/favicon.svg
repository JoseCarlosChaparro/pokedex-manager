<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.55" stop-color="#be123c"/>
      <stop offset="1" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#ff7773" stop-opacity="0.35"/>
      <stop offset="0.46" stop-color="#ffed5f" stop-opacity="0.45"/>
      <stop offset="0.54" stop-color="#83fff7" stop-opacity="0.45"/>
      <stop offset="0.62" stop-color="#d875ff" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#d8b24a"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
    <clipPath id="hole">
      <circle cx="35" cy="25.5" r="6.5"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#holo)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="url(#gold)" stroke-width="3"/>

  <!-- P with a hollow bowl -->
  <path fill="#fff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" paint-order="stroke" fill-rule="evenodd"
        d="M17 53V11h18a14.5 14.5 0 0 1 0 29h-7v13z M35 19a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13z"/>

  <!-- Poké Ball inside the bowl -->
  <g clip-path="url(#hole)">
    <rect x="28" y="18" width="14" height="7.5" fill="#f43f5e"/>
    <rect x="28" y="25.5" width="14" height="7" fill="#fff"/>
    <rect x="28" y="24.6" width="14" height="1.8" fill="#0f172a"/>
  </g>
  <circle cx="35" cy="25.5" r="2.3" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Sparkle -->
  <path fill="#fff" d="M50 44l1.4 3.6L55 49l-3.6 1.4L50 54l-1.4-3.6L45 49l3.6-1.4z"/>
</svg>
